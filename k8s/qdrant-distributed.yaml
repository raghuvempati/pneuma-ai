apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pneuma-intuition
spec:
  serviceName: "qdrant-headless"
  replicas: 3
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports:
        - containerPort: 6333
          name: http
        - containerPort: 6335
          name: p2p # Internal communication for sharding
        env:
        - name: QDRANT__CLUSTER__ENABLED
          value: "true"
        volumeMounts:
        - name: qdrant-storage
          mountPath: /qdrant/storage
  volumeClaimTemplates:
  - metadata:
      name: qdrant-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  ports:
  - port: 6333
    targetPort: 6333
  selector:
    app: qdrant